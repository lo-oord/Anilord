name: Anilord Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown to users and used in the GitHub tag
        required: true
        default: '2.6.8'
        type: string
      version_code:
        description: Integer versionCode; must be greater than the previous release
        required: true
        default: '1084'
        type: string
      release_notes:
        description: Release notes written to GitHub Release
        required: true
        default: 'تحسينات وإصلاحات.'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANILORD_RELEASE_STORE_PASSWORD: ${{ secrets.ANILORD_RELEASE_STORE_PASSWORD }}
      ANILORD_RELEASE_KEY_ALIAS: ${{ secrets.ANILORD_RELEASE_KEY_ALIAS }}
      ANILORD_RELEASE_KEY_PASSWORD: ${{ secrets.ANILORD_RELEASE_KEY_PASSWORD }}
      ANILORD_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANILORD_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore existing production keystore
        shell: bash
        run: |
          test -n "$ANILORD_RELEASE_KEYSTORE_BASE64" || { echo 'Missing ANILORD_RELEASE_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANILORD_RELEASE_STORE_PASSWORD" || { echo 'Missing ANILORD_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$ANILORD_RELEASE_KEY_ALIAS" || { echo 'Missing ANILORD_RELEASE_KEY_ALIAS'; exit 1; }
          test -n "$ANILORD_RELEASE_KEY_PASSWORD" || { echo 'Missing ANILORD_RELEASE_KEY_PASSWORD'; exit 1; }
          echo "$ANILORD_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anilord-release.jks"
          echo "ANILORD_RELEASE_STORE_FILE=$RUNNER_TEMP/anilord-release.jks" >> "$GITHUB_ENV"
      - run: chmod +x ./gradlew
      - name: Assemble signed production APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease -PversionName="${{ inputs.version_name }}" -PversionCode="${{ inputs.version_code }}"
      - name: Verify APK identity and signature
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package: name='anilord.app' versionCode='${{ inputs.version_code }}' versionName='${{ inputs.version_name }}'"
      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          TAG="v${{ inputs.version_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "Anilord $TAG" --notes "${{ inputs.release_notes }}\n\nversionCode: ${{ inputs.version_code }}"
          gh release upload "$TAG" "$APK" --clobber
